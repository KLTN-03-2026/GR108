<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Ký túc xá</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            background: #212529;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 12px 20px;
            text-decoration: none;
            transition: 0.2s;
            margin: 5px 10px;
            border-radius: 10px;
        }

        .sidebar a:hover {
            background: #343a40;
            transform: translateX(5px);
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }

        .card-box {
            border-radius: 12px;
            color: white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .topbar {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .stat-icon {
            font-size: 26px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">

    <h4 class="text-center mb-4">🏠 ADMIN</h4>

    <a th:href="@{/admin/home}">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>

    <a th:href="@{/rooms}">
        <i class="bi bi-house-door"></i> Quản lý phòng
    </a>

    <a th:href="@{/students}">
        <i class="bi bi-people"></i> Quản lý sinh viên
    </a>

    <a th:href="@{/accounts}">
        <i class="bi bi-person-circle"></i> Tài khoản
    </a>

    <a th:href="@{/bookings}">
        <i class="bi bi-calendar-check"></i> Quản lý booking
    </a>

    <a th:href="@{/logout}">
        <i class="bi bi-box-arrow-right"></i> Đăng xuất
    </a>

</div>

<!-- ================= CONTENT ================= -->
<div class="content">

    <!-- TOPBAR -->
    <div class="topbar d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Quản lý ký túc xá</h4>
        <span class="text-muted">Dashboard</span>
    </div>

    <!-- STATS -->
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card bg-primary card-box p-3 d-flex justify-content-between flex-row align-items-center">
                <div>
                    <h5>Phòng</h5>
                    <h3 th:text="${roomCount}">0</h3>
                </div>
                <i class="bi bi-house-door stat-icon"></i>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success card-box p-3 d-flex justify-content-between flex-row align-items-center">
                <div>
                    <h5>Sinh viên</h5>
                    <h3 th:text="${studentCount}">0</h3>
                </div>
                <i class="bi bi-people stat-icon"></i>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-warning card-box p-3 d-flex justify-content-between flex-row align-items-center">
                <div>
                    <h5>Tài khoản</h5>
                    <h3 th:text="${accountCount}">0</h3>
                </div>
                <i class="bi bi-person-circle stat-icon"></i>
            </div>
        </div>

    </div>
</div>

</body>
</html>
