<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh sách phòng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .room-img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🏠 Danh sách phòng</h3>

        <a th:href="@{/rooms/create}" class="btn btn-primary">
            + Thêm phòng
        </a>
    </div>

    <!-- TABLE -->
    <table class="table table-bordered table-hover bg-white shadow-sm align-middle">

        <thead class="table-dark text-center">
        <tr>
            <th>ID</th>
            <th>Ảnh</th>
            <th>Số phòng</th>
            <th>Sức chứa</th>
            <th>Đang ở</th>
            <th>Giá phòng</th>
            <th>Mô tả</th>
            <th>Hành động</th>
        </tr>
        </thead>

        <tbody class="text-center">

        <tr th:each="r : ${rooms}">

            <td th:text="${r.roomId}"></td>

            <!-- IMAGE -->
            <td>
                <img th:if="${r.image != null}"
                     th:src="@{${r.image}}"
                     width="80" height="60"
                     style="object-fit:cover">
            </td>

            <td th:text="${r.roomNumber}"></td>
            <td th:text="${r.capacity}"></td>
            <td th:text="${r.currentOccupancy}"></td>
            <td th:text="${r.roomPrice} + ' đ'"></td>

            <!-- mô tả ngắn -->
            <td>
                <span th:text="${#strings.abbreviate(r.description, 30)}"></span>
            </td>

            <!-- ACTION -->
            <td>

                <a th:href="@{'/rooms/detail/' + ${r.roomId}}"
                   class="btn btn-info btn-sm">
                    Chi tiết
                </a>

                <a th:href="@{'/rooms/edit/' + ${r.roomId}}"
                   class="btn btn-warning btn-sm">
                    Sửa
                </a>

                <a th:href="@{'/rooms/delete/' + ${r.roomId}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xóa phòng này?')">
                    Xóa
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
