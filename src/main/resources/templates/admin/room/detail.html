<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết phòng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

  <div class="card p-4 shadow">

    <h3>🏠 Chi tiết phòng</h3>

    <img th:if="${room.image != null}"
         th:src="@{${room.image}}"
         style="width:300px;height:200px;object-fit:cover">

    <p><b>Số phòng:</b> <span th:text="${room.roomNumber}"></span></p>
    <p><b>Sức chứa:</b> <span th:text="${room.capacity}"></span></p>
    <p><b>Đang ở:</b> <span th:text="${room.currentOccupancy}"></span></p>
    <p><b>Giá:</b> <span th:text="${room.roomPrice}"></span></p>
    <p><b>Mô tả:</b> <span th:text="${room.description}"></span></p>

    <a href="/rooms" class="btn btn-secondary">Quay lại</a>

  </div>

</div>

</body>
</html>
