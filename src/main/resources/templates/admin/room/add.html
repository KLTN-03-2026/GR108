<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Thêm phòng</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .preview-img {
      width: 150px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow p-4">

    <h3 class="mb-4">➕ Thêm phòng mới</h3>

    <!-- ⚠️ bắt buộc enctype để upload file -->
    <form th:action="@{/rooms/save}"
          method="post"
          th:object="${room}"
          enctype="multipart/form-data">

      <!-- ROOM NUMBER -->
      <div class="mb-3">
        <label>Số phòng</label>
        <input type="text" class="form-control" th:field="*{roomNumber}" required>
      </div>

      <!-- CAPACITY -->
      <div class="mb-3">
        <label>Sức chứa</label>
        <input type="number" class="form-control" th:field="*{capacity}" required>
      </div>

      <!-- CURRENT OCCUPANCY -->
      <div class="mb-3">
        <label>Đang ở</label>
        <input type="number" class="form-control" th:field="*{currentOccupancy}">
      </div>

      <!-- PRICE -->
      <div class="mb-3">
        <label>Giá phòng</label>
        <input type="number" step="0.01" class="form-control" th:field="*{roomPrice}">
      </div>

      <!-- IMAGE UPLOAD -->
      <div class="mb-3">
        <label>Hình ảnh phòng</label>
        <input type="file" class="form-control"
               name="imageFile"
               accept="image/*"
               onchange="previewImage(event)">
      </div>

      <!-- PREVIEW -->
      <img id="preview" class="preview-img mb-3">

      <!-- DESCRIPTION -->
      <div class="mb-3">
        <label>Mô tả</label>
        <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
      </div>

      <button type="submit" class="btn btn-success">
        Thêm mới
      </button>

      <a href="/rooms" class="btn btn-secondary">
        Quay lại
      </a>

    </form>

  </div>

</div>

<script>
  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function () {
      const output = document.getElementById('preview');
      output.src = reader.result;
      output.style.display = 'block';
    };
    reader.readAsDataURL(event.target.files[0]);
  }
</script>

</body>
</html>
