<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đặt phòng | Nhập thông tin sinh viên</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:wght@300;500&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --indigo:       #4338ca;
            --indigo-hover: #3730a3;
            --indigo-light: #e0e7ff;
            --indigo-mid:   #818cf8;
            --slate-50:  #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --red-light: #fee2e2;
            --red:       #dc2626;
            --white:     #ffffff;
            --radius:    20px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--slate-100);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 16px 80px;
            color: var(--slate-800);
        }

        .page { width: 100%; max-width: 560px; }

        /* BACK */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--slate-600);
            text-decoration: none;
            margin-bottom: 28px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--indigo); }

        /* STEPS */
        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }
        .step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .step-dot {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }
        .step-dot.active { background: var(--indigo); color: white; box-shadow: 0 0 0 4px var(--indigo-light); }
        .step-dot.todo   { background: var(--slate-200); color: var(--slate-400); }
        .step-label { font-size: 11px; color: var(--slate-400); font-weight: 500; }
        .step-label.active { color: var(--indigo); font-weight: 600; }
        .step-line { height: 2px; width: 56px; background: var(--slate-200); margin-bottom: 20px; }

        /* CARD */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--slate-200);
            overflow: hidden;
        }

        /* HEADER */
        .card-header {
            background: linear-gradient(135deg, var(--slate-900) 0%, #1e2d4f 100%);
            padding: 36px 36px 32px;
            position: relative;
            overflow: hidden;
        }
        .card-header::after {
            content: '';
            position: absolute;
            right: -40px; top: -40px;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(99,102,241,0.15);
            pointer-events: none;
        }
        .header-label {
            font-size: 12px; font-weight: 600;
            letter-spacing: .08em; text-transform: uppercase;
            color: var(--indigo-mid); margin-bottom: 8px;
        }
        .header-title {
            font-family: 'Fraunces', serif;
            font-size: 28px; font-weight: 500;
            color: var(--white); line-height: 1.2;
            position: relative; z-index: 1;
        }
        .header-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 6px;
            position: relative; z-index: 1;
        }
        .room-pill {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;
            padding: 7px 16px; margin-top: 18px;
            font-size: 13px; color: rgba(255,255,255,0.85);
            position: relative; z-index: 1;
        }
        .room-pill i { color: var(--indigo-mid); font-size: 14px; }

        /* BODY */
        .card-body { padding: 32px 36px; display: flex; flex-direction: column; gap: 24px; }

        /* ERROR */
        .error-box {
            background: var(--red-light);
            border: 1px solid #fca5a5;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex; align-items: center; gap: 10px;
            font-size: 14px; color: var(--red); font-weight: 500;
        }
        .error-box i { font-size: 16px; flex-shrink: 0; }

        /* USER CARD */
        .user-card {
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            display: flex; align-items: center; gap: 14px;
        }
        .user-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--indigo-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 700;
            color: var(--indigo); flex-shrink: 0;
        }
        .user-name  { font-size: 14px; font-weight: 600; color: var(--slate-800); }
        .user-email { font-size: 12px; color: var(--slate-400); margin-top: 2px; }

        /* SECTION LABEL */
        .section-label {
            font-size: 11px; font-weight: 600;
            letter-spacing: .1em; text-transform: uppercase;
            color: var(--slate-400); margin-bottom: 14px;
        }

        /* READONLY BANNER — hiện khi skipForm=true */
        .readonly-banner {
            display: flex; align-items: center; gap: 10px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 13px; color: #1d4ed8;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .readonly-banner i { font-size: 15px; flex-shrink: 0; }

        /* FORM */
        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 13px; font-weight: 600;
            color: var(--slate-700); margin-bottom: 7px;
        }
        .form-label .req { color: var(--indigo); margin-left: 2px; }

        /* ✅ FIX: dùng .field duy nhất, bỏ hết .input-wrap */
        .field {
            position: relative;
        }
        .field > i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: var(--slate-400);
            pointer-events: none;
            transition: color .2s;
            z-index: 1;
        }
        .field:focus-within > i { color: var(--indigo); }

        .form-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 14.5px;
            color: var(--slate-800);
            background: var(--white);
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px var(--indigo-light);
        }
        .form-input::placeholder { color: var(--slate-300); }

        /* readonly style */
        .form-input[readonly] {
            background: var(--slate-50);
            color: var(--slate-600);
            border-color: var(--slate-200);
            cursor: default;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* DIVIDER */
        .divider { height: 1px; background: var(--slate-200); }

        /* SUBMIT */
        .btn-submit {
            width: 100%; padding: 15px; border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--indigo) 0%, #6366f1 100%);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: opacity .2s, transform .15s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover  { opacity: .9; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }

        .form-hint {
            font-size: 12px; color: var(--slate-400);
            text-align: center; margin-top: -8px;
        }
    </style>
</head>

<body>
<div class="page">

    <a href="javascript:history.back()" class="back-link">
        <i class="bi bi-arrow-left"></i>
        Quay lại
    </a>

    <!-- STEPS -->
    <div class="steps">
        <div class="step">
            <div class="step-dot active">1</div>
            <span class="step-label active">Thông tin</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
            <div class="step-dot todo">2</div>
            <span class="step-label">Xác nhận</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
            <div class="step-dot todo">3</div>
            <span class="step-label">Thanh toán</span>
        </div>
    </div>

    <div class="card">

        <!-- HEADER -->
        <div class="card-header">
            <div class="header-label">Bước 1 / 3</div>

            <!-- Tiêu đề thay đổi theo trạng thái -->
            <div class="header-title"
                 th:text="${skipForm} ? 'Xác nhận thông tin sinh viên' : 'Nhập thông tin sinh viên'">
            </div>
            <div class="header-sub"
                 th:text="${skipForm} ? 'Thông tin đã được lưu, kiểm tra và tiếp tục' : 'Điền đầy đủ để tiến hành đặt phòng'">
            </div>

            <div class="room-pill" th:if="${room != null}">
                <i class="bi bi-house-door-fill"></i>
                Phòng <strong th:text="${room.roomNumber}"></strong>
                &nbsp;·&nbsp;
                <span th:text="${#numbers.formatDecimal(room.roomPrice,0,'COMMA',0,'POINT') + ' ₫/tháng'}"></span>
            </div>
        </div>

        <div class="card-body">

            <!-- ERROR -->
            <div class="error-box" th:if="${error}">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- USER INFO -->
            <div class="user-card" th:if="${user != null}">
                <div class="user-avatar">
                    <span th:text="${#strings.substring(user.fullName,0,1).toUpperCase()}"></span>
                </div>
                <div>
                    <div class="user-name"  th:text="${user.fullName}"></div>
                    <div class="user-email" th:text="${user.email}"></div>
                </div>
            </div>

            <form th:action="@{/booking/confirm}" method="post">

                <input type="hidden" name="roomId"  th:value="${room.roomId}"/>
                <input type="hidden" name="userId"  th:value="${user.userId}"/>

                <!-- ✅ BANNER: đã có thông tin -->
                <div class="readonly-banner" th:if="${skipForm}">
                    <i class="bi bi-info-circle-fill"></i>
                    Thông tin sinh viên đã được lưu trước đó. Bạn không cần nhập lại.
                </div>

                <div class="section-label" style="margin-top: 4px;">Thông tin học tập</div>

                <!-- MÃ SINH VIÊN -->
                <div class="form-group">
                    <label class="form-label">
                        Mã sinh viên
                        <span class="req" th:unless="${skipForm}">*</span>
                    </label>
                    <div class="field">
                        <i class="bi bi-person-badge"></i>

                        <th:block th:if="${skipForm}">
                            <input type="text"   class="form-input" th:value="${student.studentCode}" readonly/>
                            <input type="hidden" name="studentCode" th:value="${student.studentCode}"/>
                        </th:block>

                        <input th:unless="${skipForm}"
                               type="text" class="form-input"
                               name="studentCode"
                               placeholder="VD: SV2024001"
                               required/>
                    </div>
                </div>

                <!-- LỚP + KHOA -->
                <div class="form-row">

                    <div class="form-group">
                        <label class="form-label">Lớp</label>
                        <div class="field">
                            <i class="bi bi-people"></i>

                            <th:block th:if="${skipForm}">
                                <input type="text"   class="form-input" th:value="${student.className}" readonly/>
                                <input type="hidden" name="className"   th:value="${student.className}"/>
                            </th:block>

                            <input th:unless="${skipForm}"
                                   type="text" class="form-input"
                                   name="className"
                                   placeholder="VD: CNTT1"/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Khoa</label>
                        <div class="field">
                            <i class="bi bi-building"></i>

                            <th:block th:if="${skipForm}">
                                <input type="text"   class="form-input" th:value="${student.faculty}" readonly/>
                                <input type="hidden" name="faculty"     th:value="${student.faculty}"/>
                            </th:block>

                            <input th:unless="${skipForm}"
                                   type="text" class="form-input"
                                   name="faculty"
                                   placeholder="VD: CNTT"/>
                        </div>
                    </div>

                </div>

                <!-- CCCD -->
                <div class="form-group">
                    <label class="form-label">
                        CCCD
                        <span class="req" th:unless="${skipForm}">*</span>
                    </label>
                    <div class="field">
                        <i class="bi bi-credit-card-2-front"></i>

                        <th:block th:if="${skipForm}">
                            <input type="text"   class="form-input" th:value="${student.citizenId}" readonly/>
                            <input type="hidden" name="citizenId"   th:value="${student.citizenId}"/>
                        </th:block>

                        <input th:unless="${skipForm}"
                               type="text" class="form-input"
                               name="citizenId"
                               placeholder="12 chữ số"
                               maxlength="12"
                               required/>
                    </div>
                </div>

                <div class="divider" style="margin-bottom: 24px;"></div>

                <button type="submit" class="btn-submit">
                    <i class="bi bi-arrow-right-circle"></i>
                    <span th:text="${skipForm} ? 'Tiếp tục với thông tin đã lưu' : 'Tiếp tục đặt phòng'"></span>
                </button>

                <p class="form-hint" style="margin-top: 16px;">
                    <i class="bi bi-lock"></i>
                    Thông tin được bảo mật và chỉ dùng cho mục đích đặt phòng
                </p>

            </form>

        </div>
    </div>

</div>
</body>
</html>
