<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | KTX Sinh Viên</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
        }

        .login-title {
            font-weight: 800;
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            background: #4f46e5;
            color: white;
            border: none;
        }

        .btn-login:hover {
            background: #4338ca;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            background: #10b981;
            color: white;
            border: none;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #059669;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .small-text {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h3 class="login-title">🏠 Đăng nhập KTX</h3>
    <div th:if="${param.error}" class="error">
        Sai tài khoản hoặc mật khẩu!
    </div>

    <div th:if="${success}" class="alert alert-success">
        [[${success}]]
    </div>
    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text" name="username" class="form-control" placeholder="Nhập username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" placeholder="Nhập password" required>
        </div>

        <button type="submit" class="btn btn-login">
            Đăng nhập
        </button>

        <!-- NÚT ĐĂNG KÝ -->
        <a href="/register" class="btn btn-register">
            Đăng ký tài khoản
        </a>

    </form>

    <div class="small-text">
        © 2026 Ký túc xá sinh viên
    </div>

</div>

</body>
</html>
