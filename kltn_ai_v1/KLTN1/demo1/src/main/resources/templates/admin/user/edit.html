<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật tài khoản</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow border-0">

        <div class="card-header bg-warning">
            <h4 class="mb-0">✏️ Cập nhật User / Account</h4>
        </div>

        <div class="card-body p-4">

            <form th:action="@{/admin/accounts/update}" method="post">

                <input type="hidden" name="accountId" th:value="${account.id}">
                <input type="hidden" name="userId" th:value="${user.userId}">

                <h5 class="mb-3 text-primary">Thông tin người dùng</h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Họ tên</label>
                        <input type="text" name="fullName" class="form-control"
                               th:value="${user.fullName}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Giới tính</label>
                        <select name="gender" class="form-select" required>
                            <option value="Male" th:selected="${user.gender == 'Male'}">Nam</option>
                            <option value="Female" th:selected="${user.gender == 'Female'}">Nữ</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control"
                               th:value="${user.email}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Số điện thoại</label>
                        <input type="text" name="phone" class="form-control"
                               th:value="${user.phone}" required>
                    </div>

                </div>

                <hr>

                <h5 class="mb-3 text-primary">Thông tin đăng nhập</h5>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control"
                               th:value="${account.username}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Mật khẩu mới</label>
                        <input type="password" name="password" class="form-control"
                               placeholder="Để trống nếu không muốn đổi mật khẩu">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Vai trò</label>
                        <select name="roleName" class="form-select" required>
                            <option value="USER"
                                    th:selected="${account.role != null and account.role.rollName.name() == 'USER'}">
                                USER - Người dùng
                            </option>

                            <option value="ADMIN"
                                    th:selected="${account.role != null and account.role.rollName.name() == 'ADMIN'}">
                                ADMIN - Quản trị viên
                            </option>
                        </select>
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        Cập nhật
                    </button>

                    <a th:href="@{/admin/accounts}" class="btn btn-secondary">
                        Quay lại
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
