<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết phòng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background: linear-gradient(135deg,#eef2ff,#f8fafc);
            font-family: "Segoe UI", sans-serif;
        }

        .room-card{
            max-width: 1100px;
            margin: auto;
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        /* IMAGE LEFT */
        .room-image{
            width: 100%;
            height: 100%;
            min-height: 420px;
            object-fit: cover;
        }

        .room-title{
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
        }

        .badge-custom{
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .male{background:#dbeafe;color:#1d4ed8;}
        .female{background:#fce7f3;color:#be185d;}
        .available{background:#dcfce7;color:#15803d;}
        .full{background:#fee2e2;color:#b91c1c;}

        .info-box{
            background:#f8fafc;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .info-label{
            font-size: 12px;
            color:#64748b;
            font-weight: 600;
        }

        .info-value{
            font-size: 15px;
            font-weight: 700;
            color:#0f172a;
        }

        .price-box{
            background: linear-gradient(135deg,#4f46e5,#6366f1);
            color:white;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
        }

        .price{
            font-size: 28px;
            font-weight: 800;
        }

        .btn-custom{
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="room-card">

        <div class="row g-0">

            <!-- IMAGE LEFT -->
            <div class="col-md-4">
                <img th:if="${room.image != null}"
                     th:src="@{${room.image}}"
                     class="room-image">
            </div>

            <!-- CONTENT RIGHT -->
            <div class="col-md-8 p-4 p-md-5">

                <!-- TITLE -->
                <div class="d-flex justify-content-between flex-wrap gap-3">

                    <div>
                        <div class="room-title">
                            🏠 Phòng <span th:text="${room.roomNumber}"></span>
                        </div>

                        <div class="mt-2">

                            <span th:if="${room.gender != null and room.gender.name() == 'MALE'}"
                                  class="badge-custom male">👨 Nam</span>

                            <span th:if="${room.gender != null and room.gender.name() == 'FEMALE'}"
                                  class="badge-custom female">👩 Nữ</span>

                        </div>
                    </div>

                    <div>
                        <span th:if="${room.currentOccupancy < room.capacity}"
                              class="badge-custom available">🟢 Còn trống</span>

                        <span th:if="${room.currentOccupancy >= room.capacity}"
                              class="badge-custom full">🔴 Đầy</span>
                    </div>

                </div>

                <!-- INFO -->
                <div class="row mt-4">

                    <div class="col-md-6">
                        <div class="info-box">
                            <div class="info-label">Sức chứa</div>
                            <div class="info-value">
                                <i class="bi bi-people-fill"></i>
                                <span th:text="${room.capacity}"></span> người
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="info-box">
                            <div class="info-label">Đang ở</div>
                            <div class="info-value">
                                <i class="bi bi-person-check-fill"></i>
                                <span th:text="${room.currentOccupancy}"></span> người
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="info-box">
                            <div class="info-label">Mô tả</div>
                            <div class="info-value" th:text="${room.description}"></div>
                        </div>
                    </div>

                </div>

                <!-- PRICE -->
                <div class="price-box mt-3">
                    <div>Giá phòng</div>

                    <div class="price mt-1">
                        <span th:text="${#numbers.formatDecimal(room.roomPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>

                    <div class="mt-1">VND / tháng</div>
                </div>

                <!-- STATUS -->
                <div class="mt-3 text-center">

                    <span th:if="${room.active}" class="badge bg-success btn-custom">
                        Hoạt động
                    </span>

                    <span th:if="${!room.active}" class="badge bg-danger btn-custom">
                        Bảo trì
                    </span>

                </div>

                <!-- BUTTON -->
                <div class="mt-4 d-flex gap-2 flex-wrap">

                    <a href="/rooms" class="btn btn-outline-secondary btn-custom">
                        ← Quay lại
                    </a>

                    <a th:href="@{'/rooms/edit/' + ${room.roomId}}"
                       class="btn btn-warning btn-custom">
                        ✏️ Chỉnh sửa
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
