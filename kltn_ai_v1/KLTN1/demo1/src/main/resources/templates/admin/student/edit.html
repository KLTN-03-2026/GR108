<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow border-0">

        <div class="card-header bg-warning">
            <h4 class="mb-0">✏️ Cập nhật sinh viên</h4>
        </div>

        <div class="card-body p-4">

            <form th:action="@{/students/save}" method="post" th:object="${student}">

                <input type="hidden" th:field="*{studentId}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Mã sinh viên</label>
                        <input type="text" class="form-control" th:field="*{studentCode}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Lớp</label>
                        <input type="text" class="form-control" th:field="*{className}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Khoa</label>
                        <input type="text" class="form-control" th:field="*{faculty}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">CCCD</label>
                        <input type="text" class="form-control" th:field="*{citizenId}">
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        Cập nhật
                    </button>

                    <a th:href="@{/students}" class="btn btn-secondary">
                        Quay lại
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
