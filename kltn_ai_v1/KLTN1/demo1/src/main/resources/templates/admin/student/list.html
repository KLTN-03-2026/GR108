<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid mt-4 px-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">🎓 Quản lý sinh viên</h3>
            <p class="text-muted mb-0">Quản lý hồ sơ sinh viên trong hệ thống ký túc xá.</p>
        </div>

        <div class="d-flex gap-2">

            <!-- BACK HOME -->
            <a th:href="@{/admin/home}" class="btn btn-outline-secondary">
                ⬅ Home Admin
            </a>

            <!-- ADD -->
            <a th:href="@{/students/create}" class="btn btn-primary">
                + Thêm sinh viên
            </a>

        </div>

    </div>

    <!-- SEARCH -->
    <div class="card shadow-sm border-0 mb-3">

        <div class="card-body">

            <form th:action="@{/students}" method="get" class="row g-2">

                <div class="col-md-10">
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Tìm theo mã sinh viên, lớp, khoa..."
                           th:value="${keyword}">
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">
                        Tìm kiếm
                    </button>
                </div>

            </form>

        </div>

    </div>

    <!-- TABLE -->
    <div class="card shadow-sm border-0">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-dark text-center">
                <tr>
                    <th>ID</th>
                    <th>Mã SV</th>
                    <th>Họ tên User</th>
                    <th>SDT</th>
                    <th>Lớp</th>
                    <th>Khoa</th>
                    <th>CCCD</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody class="text-center">

                <tr th:each="s : ${students}">

                    <td th:text="${s.studentId}"></td>

                    <td class="fw-semibold text-primary"
                        th:text="${s.studentCode}">
                    </td>

                    <td class="text-start">
                        <span th:if="${s.user != null}"
                              th:text="${s.user.fullName}"></span>

                        <span th:if="${s.user == null}" class="text-danger">
                            Chưa liên kết User
                        </span>
                    </td>

                    <td>
                        <span th:if="${s.user != null}"
                              th:text="${s.user.phone}"></span>
                        <span th:if="${s.user == null}">-</span>
                    </td>

                    <td th:text="${s.className}"></td>
                    <td th:text="${s.faculty}"></td>
                    <td th:text="${s.citizenId}"></td>

                    <td>

                        <a th:href="@{/students/detail/{id}(id=${s.studentId})}"
                           class="btn btn-info btn-sm">
                            Chi tiết
                        </a>

                        <a th:href="@{/students/edit/{id}(id=${s.studentId})}"
                           class="btn btn-warning btn-sm">
                            Sửa
                        </a>

                        <a th:href="@{/students/delete/{id}(id=${s.studentId})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc muốn xóa sinh viên này không?')">
                            Xóa
                        </a>

                    </td>

                </tr>

                <tr th:if="${students == null || #lists.isEmpty(students)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        Chưa có dữ liệu sinh viên.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
