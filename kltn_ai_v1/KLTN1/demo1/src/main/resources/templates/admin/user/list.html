<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>👤 Quản lý User / Account</h3>

        <a th:href="@{/users/create}" class="btn btn-primary">
            + Thêm tài khoản
        </a>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-hover bg-white shadow-sm align-middle">

        <thead class="table-dark text-center">
        <tr>
            <th>ID User</th>
            <th>Họ tên</th>
            <th>Giới tính</th>
            <th>Email</th>
            <th>Số điện thoại</th>
            <th>Username</th>
            <th>Vai trò</th>
            <th>Hành động</th>
        </tr>
        </thead>

        <tbody class="text-center">

        <!-- Loop users -->
        <tr th:each="u : ${users}">

            <!-- ID -->
            <td th:text="${u.userId}"></td>

            <!-- Full name -->
            <td th:text="${u.fullName}"></td>

            <!-- Gender -->
            <td th:text="${u.gender}"></td>

            <!-- Email -->
            <td th:text="${u.email}"></td>

            <!-- Phone -->
            <td th:text="${u.phone}"></td>

            <!-- Username -->
            <td>
                <span th:if="${u.account != null}"
                      th:text="${u.account.username}"></span>

                <span th:if="${u.account == null}" class="text-danger">
                    Chưa có account
                </span>
            </td>

            <!-- Role (IMPORTANT FIX HERE) -->
            <td>
                <span th:if="${u.account != null and u.account.role != null}"
                      th:text="${u.account.role.roleName}"
                      th:classappend="'badge ' + (${u.account.role.roleName == 'ADMIN'} ? 'bg-danger' : 'bg-success')">
                </span>

                <span th:if="${u.account == null or u.account.role == null}"
                      class="badge bg-secondary">
                    UNKNOWN
                </span>
            </td>

            <!-- Action -->
            <td>
                <a th:if="${u.account != null}"
                   th:href="@{/users/delete/{id}(id=${u.userId})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Bạn có chắc muốn xóa account này không?')">
                    Xóa
                </a>
            </td>

        </tr>

        <!-- Empty -->
        <tr th:if="${users == null || #lists.isEmpty(users)}">
            <td colspan="8" class="text-center text-muted py-3">
                Không có dữ liệu user
            </td>
        </tr>

        </tbody>

    </table>
</div>

</body>
</html>
