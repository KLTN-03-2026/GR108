<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Thêm phòng</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>

    body{
      background:#f4f7fb;
    }

    .card-box{
      background:white;
      border-radius:20px;
      padding:30px;
      box-shadow:0 6px 24px rgba(0,0,0,0.06);
    }

    .preview-img{
      width:220px;
      height:150px;
      object-fit:cover;
      border-radius:14px;
      display:none;
      border:2px dashed #dbe2ef;
      padding:4px;
    }

    .form-label{
      font-weight:600;
      margin-bottom:8px;
    }

    .form-control,
    .form-select{
      border-radius:12px;
      padding:12px;
    }

    .btn-save{
      border-radius:40px;
      padding:10px 28px;
      font-weight:600;
    }

  </style>
</head>

<body>

<div class="container mt-5">

  <div class="card-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

      <h3 class="fw-bold mb-0">
        ➕ Thêm phòng mới
      </h3>

      <a href="/rooms"
         class="btn btn-secondary rounded-pill px-4">

        ← Quay lại
      </a>

    </div>

    <!-- FORM -->

    <form th:action="@{/rooms/save}"
          method="post"
          th:object="${room}"
          enctype="multipart/form-data">

      <div class="row">

        <!-- LEFT -->

        <div class="col-md-6">

          <!-- ROOM NUMBER -->

          <div class="mb-3">

            <label class="form-label">
              Số phòng
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{roomNumber}"
                   placeholder="Ví dụ: A101"
                   required>

            <div class="text-danger small"
                 th:errors="*{roomNumber}">
            </div>

          </div>

          <!-- CAPACITY -->

          <div class="mb-3">

            <label class="form-label">
              Sức chứa
            </label>

            <input type="number"
                   class="form-control"
                   th:field="*{capacity}"
                   min="1"
                   required>

            <div class="text-danger small"
                 th:errors="*{capacity}">
            </div>

          </div>

          <!-- CURRENT OCCUPANCY -->

          <div class="mb-3">

            <label class="form-label">
              Số người đang ở
            </label>

            <input type="number"
                   class="form-control"
                   th:field="*{currentOccupancy}"
                   min="0">

          </div>

          <!-- PRICE -->

          <div class="mb-3">

            <label class="form-label">
              Giá phòng
            </label>

            <input type="number"
                   step="0.01"
                   class="form-control"
                   th:field="*{roomPrice}"
                   placeholder="Nhập giá phòng">

            <div class="text-danger small"
                 th:errors="*{roomPrice}">
            </div>

          </div>

          <!-- GENDER -->

          <div class="mb-3">

            <label class="form-label">
              Giới tính phòng
            </label>

            <select class="form-select"
                    th:field="*{gender}">

              <option value="">
                -- Chọn giới tính --
              </option>

              <option value="MALE">
                👨 Nam
              </option>

              <option value="FEMALE">
                👩 Nữ
              </option>

            </select>

          </div>

          <!-- ACTIVE -->

          <div class="mb-3">

            <label class="form-label">
              Trạng thái phòng
            </label>

            <select class="form-select"
                    th:field="*{active}">

              <option th:value="true">
                Hoạt động
              </option>

              <option th:value="false">
                Bảo trì / Khóa
              </option>

            </select>

          </div>

        </div>

        <!-- RIGHT -->

        <div class="col-md-6">

          <!-- IMAGE -->

          <div class="mb-3">

            <label class="form-label">
              Hình ảnh phòng
            </label>

            <input type="file"
                   class="form-control"
                   name="imageFile"
                   accept="image/*"
                   onchange="previewImage(event)">

          </div>

          <!-- PREVIEW -->

          <div class="mb-3 text-center">

            <img id="preview"
                 class="preview-img">

          </div>

          <!-- DESCRIPTION -->

          <div class="mb-3">

            <label class="form-label">
              Mô tả phòng
            </label>

            <textarea class="form-control"
                      rows="8"
                      th:field="*{description}"
                      placeholder="Mô tả chi tiết phòng...">
            </textarea>

          </div>

        </div>

      </div>

      <!-- BUTTON -->

      <div class="mt-4 d-flex gap-2">

        <button type="submit"
                class="btn btn-success btn-save">

          <i class="bi bi-check-circle"></i>
          Thêm mới

        </button>

        <a href="/rooms"
           class="btn btn-outline-secondary btn-save">

          Hủy

        </a>

      </div>

    </form>

  </div>

</div>

<script>

  function previewImage(event){

    const reader = new FileReader();

    reader.onload = function(){

      const output =
              document.getElementById('preview');

      output.src = reader.result;

      output.style.display = 'block';
    };

    reader.readAsDataURL(
            event.target.files[0]
    );
  }

</script>

</body>
</html>
