<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow border-0">

        <div class="card-header bg-info text-white">
            <h4 class="mb-0">📄 Chi tiết sinh viên</h4>
        </div>

        <div class="card-body p-4">

            <table class="table table-bordered">

                <tr>
                    <th>ID sinh viên</th>
                    <td th:text="${student.studentId}"></td>
                </tr>

                <tr>
                    <th>Mã sinh viên</th>
                    <td th:text="${student.studentCode}"></td>
                </tr>

                <tr>
                    <th>Họ tên User</th>
                    <td>
                        <span th:if="${student.user != null}" th:text="${student.user.fullName}"></span>
                        <span th:if="${student.user == null}" class="text-danger">Chưa liên kết User</span>
                    </td>
                </tr>

                <tr>
                    <th>Email User</th>
                    <td>
                        <span th:if="${student.user != null}" th:text="${student.user.email}"></span>
                        <span th:if="${student.user == null}" class="text-danger">Không có</span>
                    </td>
                </tr>

                <tr>
                    <th>Lớp</th>
                    <td th:text="${student.className}"></td>
                </tr>

                <tr>
                    <th>Khoa</th>
                    <td th:text="${student.faculty}"></td>
                </tr>

                <tr>
                    <th>CCCD</th>
                    <td th:text="${student.citizenId}"></td>
                </tr>

            </table>

            <!-- FIX -->
            <a th:href="@{/students}" class="btn btn-secondary">
                Quay lại
            </a>

            <a th:href="@{/students/edit/{id}(id=${student.studentId})}"
               class="btn btn-warning">
                Sửa thông tin
            </a>

        </div>

    </div>

</div>

</body>
</html>
