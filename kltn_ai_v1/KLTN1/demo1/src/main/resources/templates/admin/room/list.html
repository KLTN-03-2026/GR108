<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh sách phòng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f5f7fb;
        }

        .room-img {
            width: 90px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
        }

        .card-box {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }

        .badge-available {
            background: #dcfce7;
            color: #15803d;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-full {
            background: #fee2e2;
            color: #b91c1c;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-male {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge-female {
            background: #fce7f3;
            color: #be185d;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

    </style>
</head>

<body>

<div class="container py-4">

    <div class="card-box">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <!-- BACK HOME -->
            <a th:href="@{/admin/home}"
               class="btn btn-outline-secondary rounded-pill px-4">

                <i class="bi bi-arrow-left"></i>
                Trang chủ
            </a>

            <h3 class="fw-bold mb-0">
                🏠 Danh sách phòng
            </h3>

            <a th:href="@{/rooms/create}"
               class="btn btn-primary rounded-pill px-4">

                <i class="bi bi-plus-circle"></i>
                Thêm phòng
            </a>

        </div>

        <!-- SEARCH -->

        <form method="get"
              th:action="@{/rooms}"
              class="row g-3 mb-4">

            <!-- KEYWORD -->
            <div class="col-md-3">
                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Tìm số phòng..."
                       th:value="${keyword}">
            </div>

            <!-- MIN PRICE -->
            <div class="col-md-2">
                <input type="number"
                       name="minPrice"
                       class="form-control"
                       placeholder="Giá từ"
                       th:value="${minPrice}"
                       min="0">
            </div>

            <!-- MAX PRICE -->
            <div class="col-md-2">
                <input type="number"
                       name="maxPrice"
                       class="form-control"
                       placeholder="Đến"
                       th:value="${maxPrice}"
                       min="0">
            </div>

            <!-- GENDER FIX -->
            <div class="col-md-2">
                <select name="gender" class="form-select">

                    <option value=""
                            th:selected="${gender == null}">
                        Tất cả giới tính
                    </option>

                    <option value="MALE"
                            th:selected="${gender != null and gender.name() == 'MALE'}">
                        Phòng nam
                    </option>

                    <option value="FEMALE"
                            th:selected="${gender != null and gender.name() == 'FEMALE'}">
                        Phòng nữ
                    </option>

                </select>
            </div>

            <!-- STATUS FIX -->
            <div class="col-md-2">
                <select name="status" class="form-select">

                    <option value=""
                            th:selected="${status == null or status == ''}">
                        Tất cả trạng thái
                    </option>

                    <option value="available"
                            th:selected="${status == 'available'}">
                        Còn trống
                    </option>

                    <option value="full"
                            th:selected="${status == 'full'}">
                        Đã đầy
                    </option>

                </select>
            </div>

            <!-- BUTTON -->
            <div class="col-md-1">
                <button type="submit"
                        class="btn btn-success w-100">
                    <i class="bi bi-search"></i>
                </button>
            </div>

        </form>

        <!-- TABLE -->

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark text-center">

                <tr>
                    <th>ID</th>
                    <th>Ảnh</th>
                    <th>Số phòng</th>
                    <th>Giới tính</th>
                    <th>Sức chứa</th>
                    <th>Đang ở</th>
                    <th>Trạng thái</th>
                    <th>Giá phòng</th>
                    <th>Mô tả</th>
                    <th width="220">Hành động</th>
                </tr>

                </thead>

                <tbody class="text-center">

                <tr th:each="r : ${rooms.content}">

                    <td th:text="${r.roomId}"></td>

                    <td>

                        <img th:if="${r.image != null}"
                             th:src="@{${r.image}}"
                             class="room-img">

                    </td>

                    <!-- ROOM NUMBER -->

                    <td class="fw-semibold"
                        th:text="${r.roomNumber}">
                    </td>

                    <!-- GENDER -->

                    <td>

                    <span th:if="${r.gender == T(com.example.demo.emumm.RoomGender).MALE}"
                          class="badge-male">

                    👨 Nam
                     </span>

                        <span th:if="${r.gender == T(com.example.demo.emumm.RoomGender).FEMALE}"
                              class="badge-female">

        👩 Nữ
    </span>

                    </td>

                    <!-- CAPACITY -->

                    <td th:text="${r.capacity}"></td>

                    <!-- OCCUPANCY -->

                    <td>

                        <span class="fw-bold"
                              th:text="${r.currentOccupancy}">
                        </span>

                        /

                        <span th:text="${r.capacity}">
                        </span>

                    </td>

                    <!-- STATUS -->
                    <td>

                        <!-- BẢO TRÌ -->
                        <span th:if="${r.active == false}"
                              class="badge bg-warning text-dark">

        🛠 Bảo trì
    </span>

                        <!-- CÒN TRỐNG -->
                        <span th:if="${r.active == true and r.currentOccupancy < r.capacity}"
                              class="badge-available">

        🟢 Còn trống
    </span>

                        <!-- ĐÃ ĐẦY -->
                        <span th:if="${r.active == true and r.currentOccupancy >= r.capacity}"
                              class="badge-full">

        🔴 Đã đầy
    </span>

                    </td>

                    <!-- PRICE -->

                    <td class="fw-bold text-primary">

                        <span th:text="${#numbers.formatDecimal(r.roomPrice, 0, 'COMMA', 0, 'POINT')}">
                        </span>

                        đ

                    </td>

                    <!-- DESCRIPTION -->

                    <td>

                        <span th:text="${#strings.abbreviate(r.description, 40)}">
                        </span>

                    </td>

                    <!-- ACTION -->

                    <td>

                        <a th:href="@{'/rooms/detail/' + ${r.roomId}}"
                           class="btn btn-info btn-sm">

                            Chi tiết
                        </a>

                        <a th:href="@{'/rooms/edit/' + ${r.roomId}}"
                           class="btn btn-warning btn-sm">

                            Sửa
                        </a>

                        <a th:href="@{'/rooms/delete/' + ${r.roomId}}"
                           class="btn btn-danger btn-sm"

                           onclick="return confirm('Xóa phòng này?')">

                            Xóa
                        </a>

                    </td>

                </tr>

                <tr th:if="${rooms.content.size() == 0}">
                    <td colspan="10"
                        class="text-center text-muted py-4">

                        Không có phòng nào
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

        <!-- PAGINATION -->

        <nav th:if="${rooms.totalPages > 1}"
             class="mt-4">

            <ul class="pagination justify-content-center">

                <li class="page-item"
                    th:classappend="${rooms.first} ? 'disabled'">

                    <a class="page-link"

                       th:href="@{/rooms(
                        page=${rooms.number - 1},
                        keyword=${keyword},
                        minPrice=${minPrice},
                        maxPrice=${maxPrice},
                        gender=${gender},
                        status=${status}
                       )}">

                        Previous
                    </a>

                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, rooms.totalPages - 1)}"

                    th:classappend="${rooms.number == i} ? 'active'">

                    <a class="page-link"

                       th:text="${i + 1}"

                       th:href="@{/rooms(
                        page=${i},
                        keyword=${keyword},
                        minPrice=${minPrice},
                        maxPrice=${maxPrice},
                        gender=${gender},
                        status=${status}
                       )}">
                    </a>

                </li>

                <li class="page-item"
                    th:classappend="${rooms.last} ? 'disabled'">

                    <a class="page-link"

                       th:href="@{/rooms(
                        page=${rooms.number + 1},
                        keyword=${keyword},
                        minPrice=${minPrice},
                        maxPrice=${maxPrice},
                        gender=${gender},
                        status=${status}
                       )}">

                        Next
                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>

</body>
</html>
