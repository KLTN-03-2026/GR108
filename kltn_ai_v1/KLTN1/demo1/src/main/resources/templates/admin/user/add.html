<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thêm tài khoản</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3 class="mb-4">➕ Thêm User / Account</h3>

        <div th:if="${param.error != null and param.error[0] == 'username'}" class="alert alert-danger">
            Username đã tồn tại!
        </div>

        <div th:if="${param.error != null and param.error[0] == 'email'}" class="alert alert-danger">
            Email đã tồn tại!
        </div>

        <div th:if="${param.error != null and param.error[0] == 'phone'}" class="alert alert-danger">
            Số điện thoại đã tồn tại!
        </div>

        <form th:action="@{/admin/accounts/save}" method="post">

            <h5 class="mb-3">Thông tin người dùng</h5>

            <div class="mb-3">
                <label class="form-label">Họ tên</label>
                <input type="text" name="fullName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Giới tính</label>
                <select name="gender" class="form-select" required>
                    <option value="">-- Chọn giới tính --</option>
                    <option value="Male">Nam</option>
                    <option value="Female">Nữ</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text" name="phone" class="form-control" required>
            </div>

            <hr>

            <h5 class="mb-3">Thông tin đăng nhập</h5>

            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Vai trò</label>
                <select name="roleName" class="form-select" required>
                    <option value="USER">USER - Người dùng</option>
                    <option value="ADMIN">ADMIN - Quản trị viên</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">
                Lưu tài khoản
            </button>

            <a th:href="@{/admin/accounts}" class="btn btn-secondary">
                Quay lại
            </a>

        </form>

    </div>

</div>

</body>
</html>
