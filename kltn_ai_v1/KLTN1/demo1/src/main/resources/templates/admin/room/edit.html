<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật phòng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f4f7fb;
        }

        .card-box{
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 6px 24px rgba(0,0,0,0.06);
        }

        .preview-img{
            width:220px;
            height:150px;
            object-fit:cover;
            border-radius:14px;
            border:2px dashed #dbe2ef;
            padding:4px;
        }

        .form-label{
            font-weight:600;
            margin-bottom:8px;
        }

        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
        }

        .btn-save{
            border-radius:40px;
            padding:10px 28px;
            font-weight:600;
        }

    </style>
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="card-box">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="fw-bold mb-0">
                ✏️ Cập nhật phòng
            </h3>

            <a href="/rooms"
               class="btn btn-secondary rounded-pill px-4">

                ← Quay lại
            </a>

        </div>

        <form th:action="@{/rooms/save}"
              method="post"
              th:object="${room}"
              enctype="multipart/form-data">

            <!-- ID -->

            <input type="hidden"
                   th:field="*{roomId}">

            <div class="row">

                <!-- LEFT -->

                <div class="col-md-6">

                    <!-- ROOM NUMBER -->

                    <div class="mb-3">

                        <label class="form-label">
                            Số phòng
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{roomNumber}">

                        <div class="text-danger small"
                             th:errors="*{roomNumber}">
                        </div>

                    </div>

                    <!-- CAPACITY -->

                    <div class="mb-3">

                        <label class="form-label">
                            Sức chứa
                        </label>

                        <input type="number"
                               class="form-control"
                               min="1"
                               th:field="*{capacity}">

                        <div class="text-danger small"
                             th:errors="*{capacity}">
                        </div>

                    </div>

                    <!-- CURRENT OCCUPANCY -->

                    <div class="mb-3">

                        <label class="form-label">
                            Đang ở
                        </label>

                        <input type="number"
                               class="form-control"
                               min="0"
                               th:field="*{currentOccupancy}">

                    </div>

                    <!-- PRICE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Giá phòng
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               th:field="*{roomPrice}">

                        <div class="text-danger small"
                             th:errors="*{roomPrice}">
                        </div>

                    </div>

                    <!-- GENDER -->

                    <div class="mb-3">

                        <label class="form-label">
                            Giới tính phòng
                        </label>

                        <select class="form-select"
                                th:field="*{gender}">

                            <option value="MALE">
                                👨 Phòng nam
                            </option>

                            <option value="FEMALE">
                                👩 Phòng nữ
                            </option>

                        </select>

                    </div>

                    <!-- ACTIVE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Trạng thái phòng
                        </label>

                        <select class="form-select"
                                th:field="*{active}">

                            <option th:value="true">
                                Hoạt động
                            </option>

                            <option th:value="false">
                                Bảo trì / Khóa
                            </option>

                        </select>

                    </div>

                </div>

                <!-- RIGHT -->

                <div class="col-md-6">

                    <!-- IMAGE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Hình ảnh mới
                        </label>

                        <input type="file"
                               class="form-control"
                               name="imageFile"
                               accept="image/*"
                               onchange="previewImage(event)">

                    </div>

                    <!-- CURRENT IMAGE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Ảnh hiện tại
                        </label>

                        <div>

                            <img th:if="${room.image != null}"
                                 th:src="@{${room.image}}"
                                 class="preview-img">

                            <p th:if="${room.image == null}"
                               class="text-muted">

                                Chưa có ảnh

                            </p>

                        </div>

                    </div>

                    <!-- PREVIEW -->

                    <div class="mb-3">

                        <label class="form-label">
                            Xem trước ảnh mới
                        </label>

                        <div>

                            <img id="preview"
                                 class="preview-img"
                                 style="display:none;">

                        </div>

                    </div>

                    <!-- DESCRIPTION -->

                    <div class="mb-3">

                        <label class="form-label">
                            Mô tả
                        </label>

                        <textarea class="form-control"
                                  rows="7"
                                  th:field="*{description}">
                        </textarea>

                    </div>

                </div>

            </div>

            <!-- BUTTON -->

            <div class="mt-4 d-flex gap-2">

                <button type="submit"
                        class="btn btn-primary btn-save">

                    <i class="bi bi-check-circle"></i>
                    Cập nhật

                </button>

                <a href="/rooms"
                   class="btn btn-outline-secondary btn-save">

                    Hủy

                </a>

            </div>

        </form>

    </div>

</div>

<script>

    function previewImage(event){

        const reader = new FileReader();

        reader.onload = function(){

            const img =
                document.getElementById('preview');

            img.src = reader.result;

            img.style.display = 'block';
        };

        reader.readAsDataURL(
            event.target.files[0]
        );
    }

</script>

</body>
</html>
